      operationId: listReferrals
      summary: Meine Empfehlungen [KUNDE]
      description: >-
        Nur gültige Empfehlungen, nur der Stand - nie Name oder Kontaktdaten der geworbenen Person.


        `status` und `created_at` kommen nur, wenn mehrere Empfehlungen aktiv sind oder die geworbene Person zugestimmt
        hat. Sonst fehlt `status`, `created_at` ist `null`.
      security:
