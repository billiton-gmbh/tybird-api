openapi: 3.1.0
info:
  title: tybird API
  version: 2.5.0
  summary: "Schnittstellen von tybird: App-API, Support-API und MCP-Server für Claude."
  description: >
    # tybird API


    tybird ist das CRM von billiton internet services. Hier stehen alle öffentlichen Schnittstellen:


    | Bereich | Für wen | Anmeldung |

    |---|---|---|

    | **App-API** | Apps für Mitarbeiter und Kunden, Auswertungen | Nutzer-Token oder API-Schlüssel |

    | **Support-API** | Produkte, die Anfragen ihrer Nutzer an den Helpdesk geben | Support-Schlüssel je Produkt |

    | **MCP-Server** | Claude als Werkzeug im CRM | OAuth, siehe „MCP-Server für Claude" |


    Die Endpunkte der App-API sind nach Zielgruppe markiert:


    | Marke | Bedeutung |

    |---|---|

    | `[MITARBEITER]` | interne Konten; sie lesen ihren Mandanten, Berater nur die eigenen Kontakte |

    | `[KUNDE]` | Konto eines Endkunden; es sieht ausschließlich die eigenen Daten |

    | `[BEIDE]` | beide |


    ## Anmeldung


    Alle Aufrufe der App-API tragen `Authorization: Bearer …`.


    **Nutzer-Token.** Für Apps, in denen sich Menschen anmelden:


    ```bash

    curl -s -X POST "https://api.tybird.com/auth/v1/token?grant_type=password" \
      -H "Content-Type: application/json" \
      -d '{"email":"name@beispiel.de","password":"…"}'

    curl -s "https://api.tybird.com/api/v1/me" \
      -H "Authorization: Bearer <access_token>"
    ```


    Der Token ist kurzlebig und wird über den Refresh-Token erneuert. Er trägt den Mandanten; der Client sendet nie eine
    Mandanten-Kennung.


    **API-Schlüssel.** Für Systeme ohne Person: `Authorization: Bearer tyb_live_…`. Ein Admin legt ihn im CRM an
    (Einstellungen, API-Schlüssel); er wird genau einmal angezeigt.


    | | Nutzer-Token | API-Schlüssel |

    |---|---|---|

    | wer | eine Person | ein Mandant |

    | lesen | was die Person sehen darf | Identität, Kontakte, Aufgaben des Mandanten |

    | nötiges Recht | - | `crm:read` |

    | schreiben | ja, nur Eigenes | nein, immer 403 |

    | Dokumente, Empfehlungen, Anfragen, Chat, Benachrichtigungen | ja | nein, 401 |


    Ein Schlüssel gehört auf einen Server, nie in einen Browser oder eine App.


    ## Regeln


    - Format JSON, UTF-8. Zeiten nach ISO 8601 mit Zeitzone. Kennungen sind UUIDs.

    - Seiten: `page` ab 1, `limit` bis 100 (Vorgabe 25).

    - Fehler der App-API: `{"error": {"code", "message"}}` mit den Codes `validation_error` (400), `unauthorized` (401),
    `forbidden` (403), `not_found` (404) und `server_error` (500). Auf den Code verzweigen, nicht auf den Text.

    - Fremde oder unsichtbare Daten antworten mit 404; ob es sie gibt, wird nicht verraten. Ein unbekannter Pfad
    antwortet ohne gültige Anmeldung mit 401.

    - Neue Felder können jederzeit dazukommen. Unbekannte Felder ignorieren.


    Neue Nachrichten im Chat kommen in Echtzeit über die Verbindung der App; die Endpunkte hier liefern Verlauf und
    Versand.


    Das vollständige **Changelog** steht als eigener Abschnitt am Ende.
