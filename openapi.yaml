          description: Support-API
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Zugangstoken einer Person aus der Anmeldung.
    apiKey:
      type: http
      scheme: bearer
      description: "API-Schlüssel eines Mandanten, `Authorization: Bearer tyb_live_…`. Nur lesen."
    supportKey:
      type: http
      scheme: bearer
      description: "Support-Schlüssel eines Produkts, `Authorization: Bearer tyb_live_…`. Nur im Backend des Produkts."
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Seite, ab 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Einträge je Seite
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AufgabenStatus:
      name: status
      in: query
      required: false
      description: "Wiederholbar oder mit Komma: `open`, `in_progress`, `done`, `cancelled`"
      schema:
        type: array
        items:
          type: string
          enum:
            - open
            - in_progress
            - done
            - cancelled
      style: form
      explode: true
  responses:
    F400:
      description: Eingabe ungültig
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
          example:
            error:
              code: validation_error
              message: assigned_to muss eine UUID sein.
    F401:
      description: Anmeldung fehlt oder ist ungültig
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
          example:
            error:
              code: unauthorized
              message: Token fehlt oder ist ungueltig.
    F403:
      description: Angemeldet, aber nicht erlaubt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
          example:
            error:
              code: forbidden
              message: Kein aktiver Tenant im Token.
    F404:
      description: Nicht gefunden - oder nicht sichtbar, das wird nicht unterschieden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
          example:
            error:
              code: not_found
              message: Kontakt nicht gefunden.
    F500:
      description: Interner Fehler
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Fehler"
          example:
            error:
              code: server_error
              message: Interner Fehler.
    S400:
      description: Pflichtfeld fehlt, zu lang, falsche Form
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: ungueltig
            meldung: Pflichtfeld fehlt, ist zu lang oder hat die falsche Form.
    S401:
      description: Schlüssel fehlt oder ist ungültig
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: nicht_angemeldet
            meldung: Schlüssel fehlt oder ist ungültig.
    S403:
      description: Ticket gehört nicht zu diesem Melder, Kunden oder Produkt
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: kein_zugriff
            meldung: Das Ticket gehört nicht zu diesem Melder, Kunden oder Produkt.
    S404:
      description: Ticket gibt es nicht
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: nicht_gefunden
            meldung: Dieses Ticket gibt es nicht.
    S413:
      description: Bild über 2 MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: bild_zu_gross
            meldung: Das Bild ist größer als 2 MB.
    S429:
      description: Zu viele Aufrufe je Melder und Stunde
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: zu_viele
            meldung: Mehr als 20 Anfragen je Melder und Stunde. Bitte später erneut senden.
    S503:
      description: Kurz nicht erreichbar, später erneut senden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SupportFehler"
          example:
            fehler: wartung
            meldung: Der Helpdesk ist kurz nicht erreichbar. Bitte später erneut senden.
  schemas:
    Fehler:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              examples:
                - validation_error
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
    Seiten:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    Me:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            name:
              type: string
            brand:
              type: object
              properties:
                accent:
                  type:
                    - string
                    - "null"
                font:
                  type:
                    - string
                    - "null"
                logo_url:
                  type:
                    - string
                    - "null"
            enabled_modules:
              type: array
              items:
                type: string
        user:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                vorname:
                  type:
                    - string
                    - "null"
                nachname:
                  type:
                    - string
                    - "null"
                email:
                  type:
                    - string
                    - "null"
                role:
                  type: string
            - type: "null"
        advisor:
          description: Nur für Kunden
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                vorname:
                  type:
                    - string
                    - "null"
                nachname:
                  type:
                    - string
                    - "null"
                role:
                  type: string
                avatar_url:
                  type:
                    - string
                    - "null"
            - type: "null"
      required:
        - tenant
        - user
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        anrede:
          type:
            - string
            - "null"
        vorname:
