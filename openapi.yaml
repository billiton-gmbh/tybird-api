        - Empfehlungen
      operationId: submitReferral
      summary: Empfehlungscode einreichen [KUNDE]
      description: >-
        Der Aufrufer ist die **geworbene** Person und reicht den Code des Werbers ein. Wiederholtes Einreichen ändert
        nichts und antwortet mit 200.


        404: kein eigener Kontakt oder unbekannter Code. 400: eigener Code.
      security:
        - bearerAuth: []
      requestBody:
