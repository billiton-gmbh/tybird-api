      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Kontakt
          schema:
            type: string
            format: uuid
        - name: docId
          in: path
          required: true
          description: Dokument
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility:
                  type: string
                  enum:
                    - internal
                    - customer_ready
              required:
                - visibility
