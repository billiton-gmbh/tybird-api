  - name: Support
    description: >
      Support-API v1. Ein Produkt meldet Fehler, Fragen und Ideen seiner Nutzer an den Helpdesk von billiton und zeigt
      ihnen den Stand.


      - **Anmeldung:** `Authorization: Bearer tyb_live_…`, je Produkt ein Schlüssel. Er bestimmt das Produkt; ihr sendet
      es nicht mit. Der Schlüssel liegt nur in eurem Backend.

      - **melder** ist die Person, **kunde** das Unternehmen, für das sie arbeitet. Beide mit eurer dauerhaften
      `extern_id`. Ihr bestimmt sie aus **eurer** Sitzung, nie aus Angaben des Browsers.

      - **Fehler:** immer `{"fehler": "<code>", "meldung": "<Satz auf Deutsch>"}`.

      - **Mails:** Beantwortet billiton eine Anfrage oder erledigt sie, informiert tybird den Melder per Mail, sobald
      der Versand für euer Produkt eingerichtet ist. Ihr müsst nichts tun.


      **Grenzen je Melder und Stunde** (in der Kundensicht je Kunde), jede Art zählt für sich:


      | Art | Aufrufe |

      |---|---|

      | Neue Anfragen (`POST /tickets`) | 20 |

      | Antworten und Bestätigen zusammen | 60 |

      | Lesen (Liste und Einzelabruf) | 600 |


      Darüber kommt **429** `zu_viele`. Der Text ist bei allen drei Arten derselbe: „Mehr als 20 Anfragen je Melder und
      Stunde. Bitte später erneut senden." Auf `fehler` verzweigen, nicht auf den Text.
  - name: MCP-Server für Claude
    description: >
      Claude arbeitet mit diesem Server direkt im CRM: Kontakte finden und anlegen, Notizen und Aufgaben schreiben, den
      Helpdesk bearbeiten. Version **1.4.0** (Streamable HTTP, Protokoll 2025-06-18).


      ### Einrichten in Claude


      1. In Claude unter Einstellungen, Connectors einen eigenen Connector hinzufügen.

      2. **Adresse:** `https://agrctimmaaoywlsuoglc.supabase.co/functions/v1/mcp`

      3. Unter den erweiterten Einstellungen die **Client-ID** eintragen. Claude braucht einen eigenen OAuth-Client;
      seine Client-ID gibt billiton aus.

      4. Verbinden, bei tybird anmelden, den **Mandanten wählen** und erlauben. Das darf ein Admin des Mandanten; ein
      Manager für sich selbst, wenn der Mandant es freigeschaltet hat.


      ### Regeln


      - **Rechte wie in der Oberfläche.** Jeder Aufruf läuft mit dem Konto der angemeldeten Person.

      - **Mandant fest.** Der Connector arbeitet nur in dem beim Verbinden gewählten Mandanten. Jede Antwort nennt ihn
      unter `mandant`. Für einen anderen Mandanten neu verbinden.

      - **Kein Löschen.** Es gibt kein Werkzeug, das Daten löscht. Ein Tag lässt sich von einem Kontakt abnehmen; der
      Tag bleibt bestehen.

      - **Herkunft markiert.** Was Claude anlegt, ist im Verlauf als „über Claude" erkennbar.

      - **Nichts überschreiben.** Bei einem vorhandenen Kontakt werden nur leere Felder ergänzt; Abweichungen werden
      gemeldet, nicht übernommen.


      ### Werkzeuge


      - `kontakt_suchen` - Findet Kontakte nach Name, E-Mail, Firma oder Domain.

      - `kontakt_lesen` - Liest die Akte mit Personen, Firma, Verlauf und offenen Aufgaben.

      - `kontakt_upsert` - Legt einen Kontakt an oder meldet den vorhandenen und ergänzt leere Felder.

      - `quellen` - Nennt die Quellen, die beim Anlegen wählbar sind.

      - `notiz_anlegen` - Schreibt eine Notiz an einen Kontakt.

      - `aufgabe_anlegen` - Legt eine Aufgabe an.

      - `aufgabe_aendern` - Ändert eine Aufgabe oder schließt sie ab.

      - `mandant_nutzer` - Nennt die aktiven Nutzer, die zuständig sein können.

      - `firma_suchen` - Findet Firmen nach Name, Ort, PLZ, E-Mail oder Telefon.

      - `person_an_firma` - Verknüpft eine Person mit einer Firma und legt die Firma bei Bedarf an.

      - `pipeline_stufen` - Nennt die gültigen Stufen im Vertrieb.

      - `stufe_setzen` - Setzt einen Kontakt in eine Stufe.

      - `tags_lesen` - Nennt die Tags mit der Zahl ihrer Kontakte.

      - `kontakt_tag_setzen` - Setzt einen Tag an einen Kontakt.

      - `kontakt_tag_entfernen` - Nimmt einen Tag von einem Kontakt ab.

      - `tag_anlegen` - Legt einen Tag an, nur Admin und Manager.


      Nur mit Zugang zum Helpdesk sichtbar:


      - `support_tickets_liste` - Listet Anfragen mit Filtern nach Produkt, Status, Art und Zuständigem.

      - `support_ticket_lesen` - Liest eine Anfrage mit allen Antworten und der Liste der Anhänge, ohne die E-Mail des Melders.

      - `support_antworten` - Antwortet dem Melder öffentlich.

      - `support_notiz` - Schreibt einen internen Vermerk, der nie nach außen geht.

      - `support_status_setzen` - Setzt den Status einer Anfrage.

      - `support_zustaendig_setzen` - Setzt den Zuständigen oder gibt die Anfrage frei.

      - `support_vormerken` - Merkt eine Anfrage für „Was ist neu?" vor (hervorheben).
      - `support_was_ist_neu` - Vorschläge für „Was ist neu?"; hervorgehobene zuerst, gesperrte nie.
  - name: Arbeiten mit dem Helpdesk
    description: >
      > **Stand.** Teil 1 gilt heute. Teil 2 gilt ab Vertrag v1.1 und ist **noch nicht verfügbar**. Heute geht im
      MCP-Server: Anfragen auflisten und lesen (`support_tickets_liste`, `support_ticket_lesen`), intern vermerken
      (`support_notiz`), Zuständige setzen (`support_zustaendig_setzen`). Den Status kennt der Helpdesk heute in fünf
      Werten, siehe Gruppe „Support".


      ### Teil 1: Als Produkt anbinden


      Die Felder stehen in der Gruppe „Support".


      1. **Schlüssel holen.** billiton gibt je Produkt einen Support-Schlüssel aus. Er liegt nur in eurem Backend.

      2. **Anfrage senden.** Euer Backend bestimmt Melder und Kunde aus eurer Sitzung und ruft `POST /tickets` auf.
      Merkt euch die `id`.

      3. **Eigene Anfragen zeigen.** `GET /tickets?melder=…` für die Liste, `GET /tickets/{id}?melder=…` für den
      Verlauf. Die Kundensicht nur für Nutzer, die sicher Admin dieses Kunden sind.

      4. **Antworten lassen.** `POST /tickets/{id}/antworten`, wenn der Nutzer nachfragt; `POST
      /tickets/{id}/bestaetigen` für „Hat geholfen".

      5. **Status anzeigen.** Zeigt dem Kunden den Status, den die Schnittstelle liefert, und nichts anderes.


      ### Teil 2: Als Entwicklungsteam abarbeiten (ab v1.1)


      Der Helpdesk ist die einzige Quelle: Tickettext, Anhänge und Rückmeldung stehen dort. GitHub-Issues gibt es für
      Anfragen nicht. Gearbeitet wird über den MCP-Server (siehe „MCP-Server für Claude").


      1. **Abholen.** Anfragen im Status „Bereit für Entwicklung", nur das eigene Produkt. Jede kommt mit ihrem
      Tickettext, dem Arbeitsauftrag (Ziel, Schritte zum Nachstellen, Akzeptanz).

          `support_entwicklung_liste`

          ```json
          {}
          ```

      2. **Übernehmen.** Setzt „In Entwicklung" und trägt dich als Entwickler ein.

          `support_entwicklung_nehmen`

          ```json
          {"ticket_id": "…"}
          ```

      3. **Lesen.** Übergabe und Verlauf der Anfrage.

          `support_ticket_lesen`

          ```json
          {"nummer": "T-1043"}
          ```

      4. **Anhänge.** Bilder und Dateien zur Anfrage.

          `support_anhaenge_lesen`

          ```json
          {"ticket_id": "…"}
          ```

      5. **Zwischenstand.** Entwicklungsnotiz, nur intern, mit Verweisen.

          `support_entwicklung_bericht`

          ```json
          {"ticket_id": "…",
           "text": "Ursache gefunden.",
           "verweise": [{"art": "pr", "wert": "https://…"}]}
          ```

      6. **Zurückmelden.** Setzt „Zur Prüfung". Bericht und Verweise (PR, Commit, Deploy) sind Pflicht.

          `support_entwicklung_fertig`

          ```json
          {"ticket_id": "…",
           "text": "Behoben und ausgeliefert.",
           "verweise": [{"art": "pr", "wert": "https://…"},
             {"art": "commit", "wert": "abc1234"},
             {"art": "deploy", "wert": "25.11.2026, 15:00"}]}
          ```

      **Eine Nachricht kommt herein** (Mail, WhatsApp, Anruf)


      1. **Suchen.** `support_ticket_suchen` mit Produkt und Stichworten. Steht eine T-Nummer in der Nachricht, danach
      suchen.

          ```json
          {"produkt": "awiti",
           "text": "Karte gesperrt"}
          ```
      2. **Bei Zweifel nach der T-Nummer fragen**, statt ein zweites Ticket anzulegen.

      3. **Kunde bestimmen.** `support_kunde_suchen` mit Name, Mail-Domain oder Kennung. Nur bei `eindeutig: true`
      zuordnen; bei „nicht eindeutig" nachfragen und die Kandidaten nennen. Groß- und Kleinschreibung zählen nicht; der
      Name findet auch Teilwörter („nea taler" findet „NEA-Taler"). Ohne Treffer nennt `aehnliche` die nächsten Namen.
      Fehlt der Kunde wirklich, legt ihn `support_kunde_anlegen` an, aber nur auf Wunsch des Nutzers: Produkt, die
      Kennung beim Produkt (`kunde_extern_id`, bei Awiti die Netz-UUID) und der Name.

          ```json
          {"produkt": "awiti",
           "name": "Beispiel GmbH",
           "melder_mail": "lea@beispiel.de"}
          ```
      4. **Anlegen.** `support_ticket_anlegen` prüft selbst auf ähnliche Tickets und legt dann erst mit
      `trotzdem_anlegen: true` an. Im CRM wird dabei nichts angelegt. Die Antwort nennt Nummer und Link und ob eine Mail
      hinausgeht.

          ```json
          {"produkt": "awiti",
           "kunde_id": "…",
           "eingang_ueber": "whatsapp",
           "art": "frage",
           "titel": "Karte gesperrt",
           "text": "…"}
          ```

      **Bei jedem Kontakt mit dem Konnektor**


      1. **Lage holen:** `support_entwicklung_lage` für das eigene Produkt.

      2. **Übernommenes prüfen:** Was steht auf „In Entwicklung", von wem, seit wie vielen Tagen?

      3. **Fertiges abgeben:** mit `support_entwicklung_fertig` auf „Zur Prüfung".

      4. **Liegengebliebenes melden**, statt es stehen zu lassen.


      **Grenze.** Das Entwicklungsteam antwortet nicht dem Kunden und setzt nie „Gelöst". Es endet bei „Zur Prüfung";
      prüfen, lösen und antworten ist Sache des Supports. Reicht die Übergabe nicht, gehört die Rückfrage in eine
      Entwicklungsnotiz.


      **Die zwei Bahnen und was der Kunde sieht**


      ```text

      BAHN SUPPORT                 Kunde sieht

      +--------------------------+

      | Neu                      | eingegangen

      +--------------------------+
        v
      +--------------------------+

      | In Klärung               | in_arbeit

      +--------------------------+
        v    (von hier, je nach Fall)
      +--------------------------+

      | Beschreibung (optional)  | in_arbeit

      | Wartet auf Kunde     (1) | rueckfrage

      | Zurückgestellt       (2) | geplant

      +--------------------------+
        v    (aus In Klärung oder
        v     Beschreibung)

      BAHN ENTWICKLUNG

      +--------------------------+

      | Bereit für Entwicklung   | in_arbeit

      +--------------------------+
        v
      +--------------------------+

      | In Entwicklung           | in_arbeit

      +--------------------------+
        v   ^ nicht in Ordnung
      +--------------------------+

      | Zur Prüfung              | in_arbeit

      +--------------------------+
        v

      ENDE

      +--------------------------+

      | Gelöst               (3) | erledigt

      +--------------------------+
        v
      +--------------------------+

      | Geschlossen              | geschlossen

      +--------------------------+


      (1) Antwort des Kunden führt zurück
          zu In Klärung
      (2) mit Datum "wieder ansehen am",
          zurück zu In Klärung
      (3) hat nicht geholfen oder Antwort:
          zurück zu In Klärung
      ```


      „Gelöst" geht auch direkt aus „In Klärung" und „Beschreibung". „Geschlossen" wird eine Anfrage, wenn der Kunde
      „Hat geholfen" bestätigt oder der Support schließt, nie von selbst. Aus „Beschreibung" geht es auch zu „Wartet auf
      Kunde" und „Zurückgestellt".


      **Dauerauftrag für Team-Chats** (kopieren, Produktnamen einsetzen)


      ```text

      Du bist das Entwicklungsteam für <PRODUKT>. Arbeite die Anfragen im

      tybird-Helpdesk über den MCP-Server ab, nur für <PRODUKT>.


      0. Beginne jede Sitzung mit support_entwicklung_lage für <PRODUKT>.
         Gib Fertiges auf "Zur Prüfung" und melde Liegengebliebenes.
      1. Nimm aus "Bereit für Entwicklung" nur Anfragen von <PRODUKT>.

      2. Übernimm eine mit support_entwicklung_nehmen. Lies Tickettext,
         Verlauf und Anhänge nur in tybird. Lege keine GitHub-Issues an.
      3. Arbeite sie ab. Halte Zwischenstände mit
         support_entwicklung_bericht fest.
      4. Melde mit support_entwicklung_fertig zurück: Bericht und Verweise
         auf PR, Commit und Deploy. Danach steht sie auf "Zur Prüfung".
      5. Antworte nie dem Kunden und setze nie "Gelöst". Fehlt dir etwas,
         schreibe es in eine Entwicklungsnotiz und nimm die nächste.
      6. Bekommst du eine Nachricht eines Kunden: erst
         support_ticket_suchen, bei Zweifel nach der T-Nummer fragen.
         Sonst support_kunde_suchen und nur bei "eindeutig" mit
         support_ticket_anlegen anlegen. Rate nie einen Kunden.
      ```
  - name: Changelog
    description: >
      Neueste oben. Jede Änderung an einer öffentlichen Schnittstelle oder einem Werkzeug steht hier. Datum ist der Tag,
      an dem die Änderung fertiggestellt wurde. Die Versionen der App-API vor 2.0.0 sind nachträglich vergeben; die
      Zwischenstände 1.2 und 1.3 des MCP-Servers gab es nicht.


      | Version |

      |---|

      | **2.5.0** · 2026-11-26 · Doku und MCP 1.11.0 - Anhänge und interne Notizen. Neue Werkzeuge: `support_anhang_link`
      (Link zum Hochladen im Browser, mehrere Bilder und PDF bis je 10 MB, 30 Minuten gültig, Vorgabe intern),
      `support_anhang_sichtbar_setzen` (Anhang für den Melder zeigen oder verbergen), `support_notiz_bearbeiten` und
      `support_notiz_entfernen` (nur eigene interne Notizen, alte Fassung bleibt, Spur im Verlauf; Antworten an den Melder
      bleiben unveränderbar). `support_anhang_anfuegen` nimmt mit `dateien` mehrere Dateien und meldet je Datei ein Ergebnis.
      Anhänge nennen `sichtbar_fuer_melder` (= nicht intern). Höchstens 100 statt 10 Anhänge je Ticket bzw. Antwort, auch in
      der Support-API (`bilder`, `anhaenge`, `anhang_ids`); je Datei unverändert Bild 5 MB, sonst 20 MB, Video 100 MB. Data-URLs
      im JSON zusammen höchstens 20 MB, darüber kommt 413 mit dem Hinweis auf `POST /anhaenge` (signierter Upload). |

      | **2.4.0** · 2026-11-26 · Doku und MCP 1.10.1 - Der Tickettext ist das Arbeitsdokument. Neues Werkzeug
      `support_ticket_text_setzen`: ersetzt den Tickettext; jede alte Fassung bleibt erhalten, der Verlauf vermerkt
      „Tickettext bearbeitet". Der Melder sieht in „Meine Anfragen" weiter seinen eigenen Text. Die Übergabe ist kein
      Arbeitsweg mehr: `support_uebergabe_schreiben` setzt nur noch „Bereit für Entwicklung", das Feld `uebergabe` ist
      veraltet. |

      | **2.3.0** · 2026-11-26 · Doku und MCP 1.10.0 - `support_kunde_suchen` findet ohne Groß- und Kleinschreibung,
      über Teilwörter in beliebiger Reihenfolge und über die Kennung; ohne Treffer nennt es ähnliche Namen. Neues Werkzeug
      `support_kunde_anlegen`: legt den Kunden eines Produkts mit seiner Kennung an und ordnet die Firma im CRM zu; prüft
      vorher auf gleiche Kennung und ähnliche Namen. 1.9.0 ist für eine andere Änderung reserviert. |

      | **2.2.0** · 2026-11-25 · Doku und MCP 1.8.0 - Je Anfrage legt `was_ist_neu` fest, ob sie in „Was ist neu?" erscheint:
      auto, hervorheben oder gesperrt. Neues Werkzeug `support_was_ist_neu` für die Vorschläge.
      `support_ticket_lesen` nennt die Anhänge mit Name, Typ und Größe. Support-API: Dateien in unbekannten Feldern werden
      mit 400 abgewiesen statt übergangen. |

      | **1.6.0** · 2026-11-25 · MCP - Entwicklungsteams können Anfragen suchen, den Kunden eindeutig bestimmen, mit
      Prüfung auf Dubletten anlegen und die Lage ihres Produkts abrufen. |

      | **2.1.0** · 2026-11-25 · Doku - Zwei neue Abschnitte auf „Arbeiten mit dem Helpdesk": eine Nachricht kommt
      herein, und bei jedem Kontakt mit dem Konnektor. |

      | **1.5.0** · 2026-11-25 · MCP - Weitere Werkzeuge für den Helpdesk: Priorität, Titel und Art ändern, zusammenlegen,
      Anhänge lesen und anfügen, an die Entwicklung übergeben. Neue Status mit festen Übergängen. |

      | **2.0.1** · 2026-11-25 · MCP - Manager können den Zugang für sich selbst einrichten, wenn ihr Mandant das
      freigeschaltet hat. Er gilt nur, solange die Rolle besteht. |

      | **2.0.0** · 2026-11-25 · Doku - Neue Referenz mit App-API, Support-API und MCP-Server an einer Stelle, als
      OpenAPI-Dokument zum Herunterladen. Dazu die Seite „Arbeiten mit dem Helpdesk" für Produkte und Entwicklungsteams.
      Die Beschreibung der App-API ist an das tatsächliche Verhalten angeglichen; die Schnittstelle selbst hat sich
      dadurch nicht geändert. |

      | **1.0.1** · 2026-11-25 · Support-API - Die Grenzen zählen jetzt je Art: 20 neue Anfragen, 60 Antworten, 600
      Abrufe je Melder und Stunde. Häufiges Lesen sperrt das Senden nicht mehr. |

      | **1.4.0** · 2026-11-25 · MCP - Sieben Werkzeuge für den Helpdesk: Anfragen auflisten, lesen, beantworten, intern
      vermerken, Status und Zuständige setzen, für „Was ist neu?" vormerken. |

      | **1.0.0** · 2026-11-25 · Support-API - Produkte können Anfragen ihrer Nutzer anlegen, auflisten, lesen,
      beantworten und bestätigen. |

      | **1.9.0** · 2026-11-10 · App-API - Akademische Titel stehen im Namen des Kontakts vor dem Vornamen. |

      | **1.1.0** · 2026-10-31 · MCP - `kontakt_lesen` nennt, ob ein Vorgang beendet ist und warum. Werkzeuge für Tags
      (seit 2026-10-29): lesen, setzen, abnehmen, anlegen. |

      | **1.0.0** · 2026-10-24 · MCP - Jede Antwort nennt den Mandanten. Neue Werkzeuge: Firma suchen, Person an Firma,
      Pipeline-Stufen lesen und setzen. |

      | **1.8.0** · 2026-10-20 · App-API - Ein Kontakt nennt die verknüpften Firmen seiner Personen. |

      | **1.0.0** · 2026-10-20 · MCP - Erste Fassung für Claude: Kontakte suchen, lesen und anlegen, Notizen, Aufgaben,
      Quellen, Nutzer. Der Mandant wird beim Verbinden fest gewählt. |

      | **1.7.0** · 2026-10-19 · App-API - Empfehlungen nennen nur noch gültige Einträge und den Auszahlungstag.
      Kundenhaustage bekommen Wunschtag, Termin, Besucher-Link und Dankeschön. |

      | **1.6.1** · 2026-10-05 · App-API - Die Hausnummer eines Kontakts ist jetzt auch mit Zusatz vollständig. |

      | **1.6.0** · 2026-09-18 · App-API - API-Schlüssel werden je Aufruf auf ihre Rechte geprüft; zum Lesen ist
      `crm:read` nötig. Im Chat gibt es die Absenderart `assistant` für den digitalen Assistenten. |

      | **1.5.0** · 2026-08-11 · App-API - Archivierte Kontakte und Spam erscheinen nicht mehr in der Liste
      (`include_spam=true` zeigt Spam). Ein Gerät lässt sich nur noch vom eigenen Konto abmelden, sonst 404. |

      | **1.4.0** · 2026-08-10 · App-API - Berater sehen nur die eigenen Kontakte. „Meine Aufgaben" umfasst zugewiesene,
      selbst angelegte und Team-Aufgaben. |

      | **1.3.0** · 2026-07-31 · App-API - Push-Nachrichten öffnen in der App direkt die passende Stelle. Beim
      Nutzerwechsel gehört das Gerät dem neu angemeldeten Konto. |

      | **1.2.0** · 2026-07-25 · App-API - Push: Geräte anmelden und abmelden, Nachrichten auf das Telefon. |

      | **1.1.0** · 2026-07-24 · App-API - Stand der bisherigen Beschreibung: Kontakte, Aufgaben, Dokumente,
      Empfehlungen, Kundenhaustage, Chat, Benachrichtigungen. API-Schlüssel für Systeme ohne Person (seit 2026-06-21). |
security:
  - bearerAuth: []
paths:
  /me:
    get:
      tags:
        - Identität
      operationId: getMe
      summary: Aktiver Mandant und eigene Identität [BEIDE]
      description: >-
        Nach der Anmeldung aufrufen: liefert den aktiven Mandanten (für das Aussehen der App) und, bei einer
        Nutzer-Anmeldung, die eigene Identität. Mit einem API-Schlüssel ist `user` gleich `null`.


        Kunden bekommen zusätzlich `advisor`, den zugeordneten Berater (oder `null`). Mitarbeiter bekommen das Feld
        nicht.


        Ein API-Schlüssel braucht das Recht `crm:read`.
      security:
        - bearerAuth: []
        - apiKey: []
      responses:
        "200":
          description: Mandant und Identität
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/F401"
        "403":
          $ref: "#/components/responses/F403"
        "404":
          $ref: "#/components/responses/F404"
        "500":
          $ref: "#/components/responses/F500"
  /contacts:
    get:
      tags:
        - Kontakte
      operationId: listContacts
      summary: Kontakte auflisten [MITARBEITER]
      description: >-
        Neueste zuerst, je Kontakt mit der Hauptperson. Archivierte Kontakte fehlen immer, als Spam erkannte nur ohne
        `include_spam=true`.


        **Berater (Rolle `hausberater`) sehen ausschließlich die ihnen zugeordneten Kontakte**; `assigned_to` auf eine
        andere Person antwortet mit 403. Andere Mitarbeiter und API-Schlüssel (Recht `crm:read`) lesen den ganzen
        Mandanten.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: search
          in: query
          required: false
          description: Suche in Vorname, Nachname, E-Mail und Ort
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Nur dieser Kontaktstatus
          schema:
            type: string
            enum:
              - neu
              - in_qualifizierung
              - qualifiziert
              - pool
              - gewonnen
              - verloren
              - tot
              - abgesagt
              - im_bau
              - uebergeben
        - name: assigned_to
          in: query
          required: false
          description: Nur Kontakte dieses Beraters
          schema:
            type: string
            format: uuid
        - name: mine
          in: query
          required: false
          description: "`true` = nur eigene. Ohne Wirkung mit API-Schlüssel"
          schema:
            type: boolean
        - name: include_spam
          in: query
          required: false
          description: "`true` = auch als Spam erkannte Kontakte"
          schema:
            type: boolean
      responses:
        "200":
          description: Seite mit Kontakten
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/KontaktKurz"
                  pagination:
                    $ref: "#/components/schemas/Seiten"
        "400":
          $ref: "#/components/responses/F400"
        "401":
          $ref: "#/components/responses/F401"
        "403":
          $ref: "#/components/responses/F403"
        "500":
          $ref: "#/components/responses/F500"
  /contacts/{id}:
    get:
      tags:
        - Kontakte
      operationId: getContact
      summary: Ein Kontakt [MITARBEITER]
      description: >-
        Alle Anzeigefelder, alle Personen und die verknüpften, nicht archivierten Firmen. Archivierte Kontakte sind hier
        lesbar (`archiviert: true`), damit ein Link aus einer Aufgabe nicht ins Leere führt.


        Ein Kontakt eines anderen Mandanten - bei Beratern auch ein fremder Kontakt - antwortet mit 404.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Kontakt
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Kontakt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kontakt"
        "400":
          $ref: "#/components/responses/F400"
        "401":
          $ref: "#/components/responses/F401"
        "403":
          $ref: "#/components/responses/F403"
        "404":
          $ref: "#/components/responses/F404"
        "500":
          $ref: "#/components/responses/F500"
  /contacts/{id}/tasks:
    get:
      tags:
        - Aufgaben
      operationId: listContactTasks
      summary: Aufgaben eines Kontakts [MITARBEITER]
      description: Sortiert nach Fälligkeit, ohne Seiten. Ohne `status` kommen alle.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Kontakt
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AufgabenStatus"
      responses:
        "200":
          description: Aufgaben
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Aufgabe"
        "400":
          $ref: "#/components/responses/F400"
        "401":
          $ref: "#/components/responses/F401"
        "403":
          $ref: "#/components/responses/F403"
        "404":
          $ref: "#/components/responses/F404"
        "500":
          $ref: "#/components/responses/F500"
  /tasks:
    get:
      tags:
        - Aufgaben
      operationId: listTasks
      summary: Meine Aufgaben [MITARBEITER]
      description: >-
        Aufgaben, die dem angemeldeten Nutzer zugewiesen sind, die er angelegt hat oder die einem seiner Teams gehören -
        für jede Rolle gleich. Mit API-Schlüssel (Recht `crm:read`): alle Aufgaben des Mandanten.


        Ohne `status` gilt `open,in_progress`. Hängt die Aufgabe an einem Kontakt, kommt ein kurzer `contact`-Block mit.
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/AufgabenStatus"
        - name: due_before
          in: query
          required: false
          description: Nur Aufgaben, die vorher fällig sind
          schema:
            type: string
            format: date-time
        - name: priority
          in: query
          required: false
          description: Nur diese Priorität
          schema:
            type: string
            enum:
              - low
              - normal
              - high
              - urgent
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Seite mit Aufgaben
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AufgabeMitKontakt"
                  pagination:
                    $ref: "#/components/schemas/Seiten"
        "400":
          $ref: "#/components/responses/F400"
        "401":
          $ref: "#/components/responses/F401"
        "403":
          $ref: "#/components/responses/F403"
        "500":
          $ref: "#/components/responses/F500"
  /tasks/{id}:
    patch:
      tags:
        - Aufgaben
      operationId: updateTask
      summary: Aufgabe ändern [MITARBEITER]
      description: >-
        Erledigen, verschieben, beschreiben. Nur die **eigene** (zugewiesene) Aufgabe, sonst 403. Mit API-Schlüssel
        immer 403: Schreiben braucht eine Person.


        `status: done` setzt `completed_at` selbst. Andere Felder als die genannten antworten mit 400.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Aufgabe
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - in_progress
                    - done
                    - cancelled
                priority:
                  type: string
                  enum:
                    - low
                    - normal
                    - high
                    - urgent
                due_at:
                  type:
                    - string
                    - "null"
                  format: date-time
                snoozed_until:
                  type:
                    - string
                    - "null"
                  format: date-time
                description:
                  type:
                    - string
                    - "null"
            example:
              status: done
      responses:
        "200":
          description: Geänderte Aufgabe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Aufgabe"
        "400":
          $ref: "#/components/responses/F400"
        "401":
          $ref: "#/components/responses/F401"
        "403":
          $ref: "#/components/responses/F403"
        "404":
          $ref: "#/components/responses/F404"
        "500":
          $ref: "#/components/responses/F500"
  /contacts/{id}/documents:
